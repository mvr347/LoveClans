gui:
  # Стандарт оформления предметов GUI (2026-10-18, RULE 10 gui-gen-6, см. docs/GUI_LORE_STYLE.md).
  # Зачем: раньше в меню жили четыре стиля подсказок клика, иконки в названиях и серые монеты, поэтому
  # одинаковые вещи выглядели по-разному. Теперь везде: название `Имя | Состояние` без значков, секции
  # `▪ Заголовок:` с отступом 2 пробела, чек-листы ✓/✕, шкала в 16 клеток, перед кликами строка-разделитель
  # и `ЛКМ — действие`, у неактивной кнопки статус + `Причина:` + заблокированный клик, число и глиф монет белые.
  # Ключ, чей текст заканчивается блоком кликов, хранится списком (разделитель + строки кликов): меню читает его
  # через components(). Правки админа в этом разделе при обновлении lang-version перезаписываются.
  style:
    separator: "<dark_gray><st>─────────────────────</st>"
    # Строка причины: используется там, где причина собрана в Java (не из deny-ключа), например в Казус белли.
    reason: "<red>Причина: <gray><reason>"
    click:
      left: "<green>ЛКМ <dark_gray>— <gray><action>"
      right: "<gold>ПКМ <dark_gray>— <gray><action>"
      shift-left: "<yellow>Shift+ЛКМ <dark_gray>— <gray><action>"
      shift-right: "<yellow>Shift+ПКМ <dark_gray>— <gray><action>"
    blocked-click: "<dark_gray><click> — <action> (заблокировано)"
    # Название неактивной кнопки: Java подставляет обычное название без цветов (так не нужен второй ключ на каждую кнопку).
    name-unavailable: "<gray><name> <dark_gray>| <red>Недоступно"
    action:
      open: "открыть"
    status:
      unavailable: "<red>✕ Действие недоступно"
      locked: "<red>✕ Действие заблокировано"
      cooldown: "<yellow>⌛ Перезарядка"
      max: "<green>✔ Достигнут предел"
  activity:
    title: "<dark_gray>Активность: <clan>"
    info:
      name: "<gold>Активность клана"
      lore: "<gray>Очки за участие в войнах, набегах, осадах, казну и дипломатию."
    period:
