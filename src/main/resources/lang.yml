# LoveClans language file (Russian)
# Keys are looked up via Bukkit YamlConfiguration.getString("a.b.c") which resolves
# dotted paths against nested YAML sections, so all keys below are grouped by their
# top-level (and further) namespace segments.
#
# Placeholders are written as <name> and are substituted by MiniMessage TagResolvers
# (see MessageService#parse). The special <prefix> tag is replaced with the value of
# the top-level "prefix" key below.

# Версия lang.yml (2026-10-12): при росте версии админский файл получает из jar переписанные разделы
# (gui, war, trade и др.), потому что copyDefaults не обновляет уже существующие строки. Не меняйте вручную.
lang-version: 12
prefix: "<gray>[<gold>LoveClans<gray>] "

general:
  error: "<prefix><red>Произошла ошибка: <reason>"
  no-permission: "<prefix><red>У вас нет прав для выполнения этого действия."
  players-only: "<prefix><red>Эту команду может использовать только игрок."
  player-not-found: "<prefix><red>Игрок <player> не найден."
  invalid-number: "<prefix><red>Указано некорректное число."
  must-be-online: "<prefix><red>Для этого действия нужно быть онлайн."
  invalid-relation: "<prefix><red>Указан некорректный тип отношений."
  unknown-command: "<prefix><red>Неизвестная команда. Используйте /clan help."
  reloaded: "<prefix><green>Конфигурация и язык плагина успешно перезагружены."
  chat-input-cancelled: "<prefix><yellow>Ввод отменён."
  # /clan admin, /clan reload и /clan artifact переехали под единую /loveclansadmin -
  # вместо того чтобы команда молча ничего не делала для тех, кто по привычке набирает
  # старый путь, она указывает, куда переехало нужное действие.
  command-moved: "<prefix><yellow>Эта команда переехала: используйте <aqua><command></aqua>.</yellow>"
  # Было захардкожено в ClanCommand#checkAntiCheat отдельным MiniMessage.deserialize(...) со
  # своим префиксом "[Кланы]" вместо общего <prefix> — добавлено 2026-09-23 по итогам аудита
  # нелокализированных строк.
  anticheat-blocked: "<prefix><red>Действие заблокировано: у вас зафиксирован высокий риск античита!</red>"

