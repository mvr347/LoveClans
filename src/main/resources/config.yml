database:
  type: SQLITE # SQLITE or MYSQL
  pool-size: 4
  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: ""
    use-ssl: false
    properties:
      cachePrepStmts: true
      prepStmtCacheSize: 250
      prepStmtCacheSqlLimit: 2048

# Экономика (2026-10-03: пересчёт под номиналы LoveCore 1 / 100 / 2 000 / 20 000).
# Все суммы плагина — в медных единицах; в конфигах можно писать строкой "3i 50c"
# (c = медная, i = железная, g = золотая, d = алмазная). Индекс цен LoveCore
# (/lovecoreadmin economy index) применяется к платёжным ключам
# (налог, знамя, укрепление, плата за создание).
economy:
  migration:
    # Во сколько раз пересчитать деньги в БД (казна кланов, деньги в незавершённых сделках) при каждом шаге
    # economy.scale-version в LoveCore. 5 — середина между ростом цен в 3–8 раз; перед пересчётом делается копия
    # loveclans.db.pre-economy-v*. Остаток правится индексом цен.
    factor: 5.0

clans:
  tag:
    min-length: 3
    max-length: 6
    pattern: "^[A-Za-z0-9_]+$"
  name:
    min-length: 4
    max-length: 10
    # pattern — белый список символов для названия клана. Название рендерится без экранирования
    # через PlaceholderAPI (см. PlaceholderAPIHook), поэтому запрещаем управляющие символы и
    # последовательности, которые можно использовать для инъекции MiniMessage/легаси цветовых кодов
    # (символы "<", ">", "&", "§"). Буквы разрешены в широком unicode-диапазоне (кириллица и т.д.),
    # также разрешены пробелы, цифры, дефис и подчёркивание.
    pattern: "^[\\p{L}\\p{N} _-]+$"
  creation-cooldown-seconds: 86400

  # Токсичным игрокам закрыт вход в ПРИЗНАННЫЕ кланы через приглашение или заявку —
  # непризнанные остаются открытыми для всех (LoveCore.BehaviorLevels, из LoveBehavior).
  recognized-join-gate:
    enabled: true
    max-politeness-level: 0   # ступень вежливости 0-6 и ниже ("Ужасно")
  rejoin-cooldown-seconds: 3600
  default-tag-color: "<gold>"
  # dye-color — имя org.bukkit.DyeColor, используется для окраски щитов в цвет клана (см. ShieldColorManager).
  # Указано явно, а не выведено из material, так как *_TERRACOTTA не соответствует напрямую DyeColor.
  available-colors:
    white: { tag: "<white>", material: WHITE_WOOL, name: "Белый", dye-color: WHITE }
    gray: { tag: "<gray>", material: GRAY_WOOL, name: "Серый", dye-color: LIGHT_GRAY }
    dark_gray: { tag: "<dark_gray>", material: GRAY_TERRACOTTA, name: "Тёмно-серый", dye-color: GRAY }
    black: { tag: "<black>", material: BLACK_WOOL, name: "Чёрный", dye-color: BLACK }
    red: { tag: "<red>", material: RED_WOOL, name: "Красный", dye-color: RED }
    dark_red: { tag: "<dark_red>", material: RED_TERRACOTTA, name: "Тёмно-красный", dye-color: RED }
    gold: { tag: "<gold>", material: ORANGE_WOOL, name: "Золотой", dye-color: ORANGE }
    yellow: { tag: "<yellow>", material: YELLOW_WOOL, name: "Жёлтый", dye-color: YELLOW }
    green: { tag: "<green>", material: LIME_WOOL, name: "Зелёный", dye-color: LIME }
    dark_green: { tag: "<dark_green>", material: GREEN_WOOL, name: "Тёмно-зелёный", dye-color: GREEN }
    aqua: { tag: "<aqua>", material: LIGHT_BLUE_WOOL, name: "Голубой", dye-color: LIGHT_BLUE }
    dark_aqua: { tag: "<dark_aqua>", material: CYAN_WOOL, name: "Бирюзовый", dye-color: CYAN }
    blue: { tag: "<blue>", material: BLUE_WOOL, name: "Синий", dye-color: BLUE }
    dark_blue: { tag: "<dark_blue>", material: BLUE_TERRACOTTA, name: "Тёмно-синий", dye-color: BLUE }
    light_purple: { tag: "<light_purple>", material: MAGENTA_WOOL, name: "Розовый", dye-color: MAGENTA }
    dark_purple: { tag: "<dark_purple>", material: PURPLE_WOOL, name: "Фиолетовый", dye-color: PURPLE }
  default-emblem: WHITE_BANNER
  invite-expire-seconds: 120
  friendly-fire: false
  # Прогрев телепорта "/clan home" в секундах — во время него игрок видит боссбар с обратным
  # отсчётом; движение или повторный вызов /clan home отменяет телепорт. 0 — телепорт мгновенный.
  home-teleport-warmup-seconds: 60

  # Общий клановый сундук (§2, /clan chest) — единое хранилище денег (currency-item, отдельный
  # слот) и предметов (обычное хранилище). Заменяет прежний отдельный /clan bank. Новые ряды
  # предметов разблокируются улучшением "Сундук" (upgrades.CHEST), а не покупкой за деньги.
  # base-chest-rows/max-chest-rows заданы в limits.
  chest:
    currency-item: 'currency:gold_coin'
    tax:
      # Налог платят только признанные кланы (/loveclansadmin recognize|unrecognize) — непризнанные
      # налога не платят вовсе.
      tax-free-until-level: 1
      # Базовая недельная плата признанного клана. Число или строка ("50i" = 50 железных = 5 000).
      # 2026-10-03: 1000 → "50i" при переходе на номиналы 1/100/2000/20000. Типичный клан (10 человек,
      # 4 территории) платит ≈ 1.9× базы — около 5 золотых монет в неделю: ощутимо, но посильно активному клану.
      base-amount: "50i"
      percent-per-member: 0.05
      percent-per-territory: 0.15
      percent-per-extra-row: 0.10
      # Если сундук признанного клана остаётся заблокирован за неуплату налога дольше этого
      # льготного срока, клан автоматически распускается (см. tickChestTaxes в ClanManager).
      grace-period-days: 3
      # Скидка на весь недельный налог клана, если у ГЛАВЫ клана высокая вежливость или
      # добрый стиль игры (LoveCore.BehaviorLevels, ставит LoveBehavior).
      leader-behavior-discount:
        enabled: true
        percent: 0.10
        politeness-threshold: 5   # ступень вежливости 0-6
        playstyle-threshold: 6    # ступень стиля игры 0-6 ("добрый")

  # Эмбарго/блокада/письма (§5). Влияние для блокады берётся из influence.blockade-multiplier.
  diplomacy:
    letter-max-length: 256

  # Торговля между кланами через сундук (§4.2). Без ограничения по количеству - только кулдаун
  # на пару кланов. Требует permission ClanPermission.TRADE.
  trade:
    cooldown-minutes: 30
    # Торговля с казной сервера (/clan chest → «Казна сервера»).
    server:
      # 2026-10-03: награда за стак = цена по модели LoveCore (по рецептам) × этот процент. 70 %: государство
      # платит меньше рыночной цены — это сток денег, чтобы сдача ресурсов не была выгоднее продажи игрокам
      # (скупщик LoveShop платит 55 %, торговля между игроками — 100 %). Пока модель цен не готова или не знает
      # предмета, берутся значения из кода (запасные).
      payout-percent: 70
    # Когда обе стороны финально подтвердили сделку, она не исполняется сразу - в течение
    # этого окна любая сторона ещё может отменить сделку или изменить предложение (что сбрасывает
    # подтверждение обеих сторон и требует подтвердить заново).
    confirm-delay-minutes: 3
    delivery:
      # После исполнения сделки товар/деньги не зачисляются в сундук сразу, а приходят каждой
      # стороне отдельно спустя это время.
      delay-minutes: 10
      # Как часто перепроверяются доставки, чей срок уже наступил - если сундук получателя
      # заполнен, доставка остаётся висеть в очереди и повторяется с этим интервалом.
      retry-seconds: 60

  # Клановые обеты (§1) — два слота: недельный (календарная неделя пн-вс) и месячный (календарный
  # месяц). Клан берёт по одному обету каждого вида; когда обета нет, меню предлагает на выбор три
  # случайных обета нужного периода. Тройка зависит только от клана и номера периода, поэтому она
  # одна и та же для всех участников и не меняется от перезахода (перебросить её нельзя).
  # Обновление: неделя — в понедельник 00:00, месяц — 1-го числа 00:00 (часовой пояс сервера).
  # Месячный пул отдельно не заводится: он строится из недельного (monthly.target-multiplier,
  # monthly.reward-multiplier), чтобы был один каталог, а не два рассинхронизирующихся.
  # 2026-10-05: ежедневные обеты убраны по просьбе владельца; NPC-Маршал (clans.contracts.npc-id)
  # убран — обеты теперь открывает NPC «Гильдмастер» (clans.guildmaster) и команда /clan contracts.
  #
  # 2026-10-05: за период клан берёт один недельный и один месячный обет. Выполнил и забрал награду
  # или провалил - следующий того же вида только в новом периоде, иначе клан фармил бы награды
  # серией быстрых обетов из одной тройки.
  #
  # Сложность (§1.2): множитель = difficulty.base + (Члены-1) × difficulty.per-member-step,
  # применяется к целям объективов и наградам. penalty-percent — доля от (уже отмасштабированной)
  # награды, вычитаемая из опыта клана, если обет не выполнен к концу периода.
  #
  # progress-flush-seconds — как часто прогресс обетов пишется в БД. Раньше писали на каждое
  # добытое/убитое/скрафченное — на сервере это сотни записей в минуту ради цифры в меню; теперь
  # пачкой раз в N секунд (завершение обета и выключение сервера пишут сразу). При аварийном
  # падении теряется не больше N секунд прогресса. Меньше 5 не принимается.
  contracts:
    tick-interval-minutes: 5
    progress-flush-seconds: 30
    penalty-percent: 80
    difficulty:
      base: 1.0
      per-member-step: 0.15
    weekly:
      # Сколько обетов показывать на выбор (1-3: в меню три места).
      choices: 3
      reward-upgrade-points: 1
      pool:
        weekly_ore_veins:
          name: 'Обет Рудных Жил'
          description: 'Всем кланом добыть 6000 единиц любой руды.'
          objective:
            type: MINE_ANY_ORE
            target: 6000
          reward-xp: 7000
        weekly_ore_deep:
          name: 'Обет Глубинных Пластов'
          description: 'Всем кланом добыть 9000 единиц любой руды.'
          objective:
            type: MINE_ANY_ORE
            target: 9000
          reward-xp: 10000
        weekly_stone_quarry:
          name: 'Обет Каменоломни'
          description: 'Добыть 20000 булыжника.'
          objective:
            type: MINE_BLOCK
            block-type: COBBLESTONE
            target: 20000
          reward-xp: 6000
        weekly_deepslate:
          name: 'Обет Тёмных Пещер'
          description: 'Добыть 15000 глубинного сланца.'
          objective:
            type: MINE_BLOCK
            block-type: DEEPSLATE
            target: 15000
          reward-xp: 7000
        weekly_netherrack:
          name: 'Обет Адского Похода'
          description: 'Добыть 10000 адского камня в Нижнем мире.'
          objective:
            type: MINE_BLOCK
            block-type: NETHERRACK
            target: 10000
          reward-xp: 6500
        weekly_zombie_purge:
          name: 'Обет Зачистки Нежити'
          description: 'Уничтожить 800 зомби.'
          objective:
            type: KILL_MOB
            mob-type: ZOMBIE
            target: 800
          reward-xp: 7000
        weekly_skeleton_hunt:
          name: 'Обет Охоты на Скелетов'
          description: 'Уничтожить 800 скелетов.'
          objective:
            type: KILL_MOB
            mob-type: SKELETON
            target: 800
          reward-xp: 7000
        weekly_spider_hunt:
          name: 'Обет Паучьей Охоты'
          description: 'Уничтожить 600 пауков.'
          objective:
            type: KILL_MOB
            mob-type: SPIDER
            target: 600
          reward-xp: 6000
        weekly_enderman_hunt:
          name: 'Обет Странников Края'
          description: 'Уничтожить 200 эндерменов.'
          objective:
            type: KILL_MOB
            mob-type: ENDERMAN
            target: 200
          reward-xp: 8000
        weekly_wither_skeleton:
          name: 'Обет Иссушенных Костей'
          description: 'Уничтожить 150 иссушенных скелетов в Нижнем мире.'
          objective:
            type: KILL_MOB
            mob-type: WITHER_SKELETON
            target: 150
          reward-xp: 9000
        weekly_blaze_hunt:
          name: 'Обет Огненного Похода'
          description: 'Уничтожить 150 ифритов.'
          objective:
            type: KILL_MOB
            mob-type: BLAZE
            target: 150
          reward-xp: 9000
        weekly_raider_hunt:
          name: 'Обет Зачистки Разбойников'
          description: 'Уничтожить 400 разбойников (иллагеров).'
          objective:
            type: KILL_MOB
            mob-type: PILLAGER
            target: 400
          reward-xp: 7500
        weekly_blood_oath:
          name: 'Обет Крови'
          description: 'Сдать 15 голов игроков из враждебных кланов через bounty.'
          objective:
            type: BOUNTY_TURN_IN
            target: 15
          reward-xp: 11000
        weekly_purification:
          name: 'Обет Очищения'
          description: 'Уничтожить Иссушителя 5 раз всем кланом.'
          objective:
            type: KILL_MOB
            mob-type: WITHER
            target: 5
          reward-xp: 14000
        weekly_craft_arrows:
          name: 'Обет Оружейника'
          description: 'Скрафтить 5000 стрел.'
          objective:
            type: CRAFT_ITEM
            item-type: ARROW
            target: 5000
          reward-xp: 6000
        weekly_craft_tnt:
          name: 'Обет Подрывника'
          description: 'Скрафтить 200 динамита.'
          objective:
            type: CRAFT_ITEM
            item-type: TNT
            target: 200
          reward-xp: 7500
        weekly_fishing_guild:
          name: 'Обет Рыбацкой Гильдии'
          description: 'Выловить 1000 рыбы удочкой.'
          objective:
            type: FISH_ITEM
            item-type: COD
            target: 1000
          reward-xp: 6500
        weekly_duelists:
          name: 'Обет Дуэлянтов'
          description: 'Одержать 50 побед в PvP над игроками.'
          objective:
            type: PVP_KILL
            target: 50
          reward-xp: 12000
        weekly_cattlemen:
          name: 'Обет Скотоводов'
          description: 'Развести 300 коров.'
          objective:
            type: BREED_ANIMAL
            animal-type: COW
            target: 300
          reward-xp: 6000
        weekly_enchanters:
          name: 'Обет Зачарователей'
          description: 'Зачаровать 100 предметов эффектом Остроты.'
          objective:
            type: ENCHANT_ITEM
            enchantment-type: sharpness
            target: 100
          reward-xp: 8000
    # Месячный обет = недельный из пула выше, но цель умножается на target-multiplier, а награда в
    # опыте — на reward-multiplier. Прогресс засчитывается в недельный и месячный обет одновременно
    # (одно и то же убийство идёт в оба), поэтому месячный — надбавка поверх недельного, а не замена.
    # 4.0 / 3.0: цель вчетверо больше, награда втрое — ставка за единицу работы чуть ниже недельной,
    # чтобы месячный не обесценивал недельные. Это баланс на усмотрение владельца: 4.0 / 4.0 уравняет ставки.
    monthly:
      choices: 3
      target-multiplier: 4.0
      reward-multiplier: 3.0
      # Очки улучшений за месячный обет (за недельный — weekly.reward-upgrade-points).
      reward-upgrade-points: 3

  # NPC «Гильдмастер»: привязывается командой /loveclansadmin createnpc guildmaster, стоя рядом с
  # уже созданным через ванильный /npc create NPC; -1 отключает взаимодействие с NPC.
  # Без клана / без права на обеты открывает список кланов (/clans); с правом на обеты — меню
  # «Обеты» и «Список кланов»; владельцу непризнанного клана добавляется «Признание клана».
  guildmaster:
    npc-id: -1
    npc-bind-distance: 6.0

  # Признание клана (Гильдмастер, только владелец): платное и мгновенное. Признанный клан получает
  # больше слотов участников и территорий, торговлю с сервером и платит налог сундука — поэтому
  # цена заметная, но не «элитная». 2026-10-05: 25 золотых монет (50 000) — выше знамени (5g) в 5
  # раз: знамя лишь основывает клан, признание открывает почти все его возможности.
  # Число (в медных) или строка монет: "25g", "1d 5g".
  recognition:
    cost: "25g"

  # NPC-основатель: продаёт Знамя Основания (clans.banner.cost), установка которого создаёт клан
  # и сразу начинает захват территории на месте установки (см. ClanBannerListener,
  # ClanBannerCreationMenu). Привязывается командой /clansadmin createnpc banner, стоя рядом с
  # уже созданным через ванильный /npc create NPC; -1 отключает взаимодействие с NPC.
  banner:
    npc-id: -1
    # 2026-09-26: цена поднята втрое (было 1000) по просьбе владельца - теперь покупка идёт через
    # GUI-подтверждение (BannerPurchaseConfirmMenu), где эта сумма видна игроку заранее.
    # 2026-10-03: 3000 → "3g" (6 000) при новых номиналах: основание клана — заметная трата,
    # но не «элитный» уровень (алмазная монета — 20 000).
    # 2026-10-05: "3g" → "5g" (10 000) по просьбе владельца: знамя — единственный вход в клановую
    # систему, и по 6 000 основывать кланы было слишком дёшево. Игрок, который уже состоит в клане,
    # знамя не получает даже при достаточной сумме.
    cost: "5g"

limits:
  max-level: 20
  base-members: 10
  members-per-upgrade: 3
  base-territories: 4
  territories-per-level: 1
  territories-per-upgrade: 2
  experience-percent-per-upgrade: 5.0
  base-chest-rows: 3
  max-chest-rows: 6

leveling:
  # base-exp удвоен (было 100), изменено 2026-09-23 — по запросу владельца: усложнение
  # получения уровня клана в 2 раза. experienceForLevel(level) = base-exp * multiplier^(level-2),
  # base-exp — множитель перед степенью, поэтому его удвоение ровно вдвое поднимает требуемый
  # опыт на КАЖДОМ уровне, не меняя форму кривой (в отличие от изменения multiplier, которое
  # искажало бы прогрессию экспоненциально).
  base-exp: 200
  multiplier: 1.83
  territory-claim-exp: 150
  war-win-exp: 1200
  # Опыт за проведённый ритуал, отдельно по каждому типу.
  ritual-exp:
    harvest: 250
    war_drum: 350
    guardian: 300

upgrades:
  MEMBERS:
    max-level: 5
  TERRITORIES:
    max-level: 5
  EXPERIENCE:
    max-level: 5
  # Уровни этого улучшения = число рядов сундука сверх базового (limits.base-chest-rows).
  # max-level здесь должен совпадать с (limits.max-chest-rows - limits.base-chest-rows).
  CHEST:
    max-level: 3

# Клановые перки (§7) — доступны с perks.unlock-level, один активный за раз, смена стоит
# опыта клана после первого (бесплатного) выбора.
perks:
  unlock-level: 5
  respec-cost-experience: 10000
  tick-seconds: 15
  harvester:
    crop-growth-bonus-percent: 40
    harvest-yield-bonus-percent: 10
    pvp-bonus-hearts: 2
  miner:
    resource-yield-bonus-percent: 25
    rare-drop-bonus-percent: 15
    ore-break-particle: HAPPY_VILLAGER
    # Тип босса, за убийство которого действует бонус на редкий дроп (§7.1's "боссов, редких рейдов").
    rare-drop-boss-type: WITHER
  warrior:
    banner-damage-bonus-percent: 10
    siege-duration-reduction-percent: 25

mechanics:
  afk:
    threshold-seconds: 120
  spirit:
    enabled: true
    tick-seconds: 15
    # Радиуса у ауры духа нет: баффы действуют на территории клана целиком
    # (SpiritManager определяет зону через getClanAt, а не через расстояние).
    buffs:
      1:
        - "SPEED:0"
      5:
        - "SPEED:1"
        - "HASTE:0"
      10:
        - "SPEED:1"
        - "HASTE:1"
        - "RESISTANCE:0"
      15:
        - "SPEED:2"
        - "HASTE:1"
        - "RESISTANCE:0"
      20:
        - "SPEED:2"
        - "HASTE:2"
        - "RESISTANCE:1"
  rituals:
    # 2026-10-05: ритуалы отключены по решению владельца сервера («пока отключи ритуалы и голосования»).
    # false — /clan ritual отвечает «временно отключено», новые ритуалы не запускаются и фоновая
    # задача не создаётся. true возвращает прежнее поведение без миграций; после смены ключа нужен
    # перезапуск сервера (фоновая задача создаётся только при старте).
    enabled: false
    cooldown-hours: 24
    duration-seconds: 600
  succession:
    # 2026-10-05: голосования за нового главу отключены тем же решением. false — голосования не
    # открываются при долгом отсутствии главы, /clan vote отвечает «временно отключено»;
    # передача лидерства вручную работает как раньше. Чтобы включить обратно — true и перезапуск
    # сервера (проверка отсутствия главы запускается только при старте).
    enabled: false
    offline-days-trigger: 14
    vote-duration-hours: 48
    quorum-percent: 50
  artifacts:
    war-horn-cooldown-seconds: 300

# Влияние клана — производный показатель авторитета клана на сервере, пересчитывается
# автоматически при изменении числа участников, завершении войны/осады/набега, повышении
# уровня клана и трате очков улучшений (см. InfluenceManager).
influence:
  member-weight: 10
  level-weight: 5
  upgrade-point-weight: 20
  war-win-weight: 50
  war-loss-weight: 25
  siege-win-weight: 75
  siege-loss-weight: 40
  raid-win-weight: 30
  raid-loss-weight: 15
  # Клан А может устроить блокаду клану Б только если Влияние(А) >= Влияние(Б) * blockade-multiplier.
  blockade-multiplier: 1.5
  # Клан нельзя выбрать целью набега, если его влияние >= (среднее влияние кланов сервера) * raid-immunity-multiplier.
  raid-immunity-multiplier: 2.0

war:
  # Цели войны помимо убийств: слабому в PvP клану нужен другой путь к победе
  objectives:
    # Очки за удержание спорной территории, если на ней есть бойцы только одной стороны
    control-score: 1
    control-tick-seconds: 30
    # Очки защитникам за снос осадного лагеря во время войны
    camp-break-score: 3
  # Таймер (босс-бар) между объявлением войны и её реальным началом (баннеры, компасы,
  # осадный режим территории появляются только после этого таймера).
  pre-start-minutes: 10
  duration-minutes: 30
  cooldown-hours: 24
  # Сколько войн может идти на сервере одновременно.
  max-concurrent: 3
  # Сколько участников с каждой стороны должно быть онлайн, чтобы объявить войну.
  min-online: 3
  # Сколько времени вражеский клан должен непрерывно удерживать сломанное знамя территории,
  # прежде чем клан-защитник автоматически проигрывает войну и распускается.
  banner-capture-minutes: 3
  # Сколько ударов подряд нужно нанести по вражескому знамени, прежде чем оно сломается
  # (знамя больше не ломается с одного удара во время войны).
  banner-break-hits: 5
  # Если по знамени не бьют дольше этого времени, прогресс поломки сбрасывается.
  banner-break-progress-reset-seconds: 15

  # Бонус к урону по вражескому клану во время активной войны за агрессивный стиль игры
  # атакующего (LoveCore.BehaviorLevels, ставит LoveBehavior) - "военные действия" отдают
  # агрессивным игрокам больше, симметрично тому, как миролюбивым отдают больше в торговле.
  aggressive-playstyle-bonus:
    enabled: true
    damage-percent: 0.10
    playstyle-threshold: 0   # ступень стиля игры 0-6 ("агрессивный") и ниже

# Осада (§3) — второй тип конфликта клана: атакующие ставят осадные лагеря вокруг территории
# защитника, каждый лагерь должен продержаться camp-hold-minutes без разрушения, чтобы осада
# прорвалась. Как и война, начинается не сразу, а после pre-start-minutes (босс-бар).
siege:
  # Укрепление осадных лагерей: атакующие тратят казну, защитникам приходится
  # бить лагерь несколько раз вместо одного удара.
  fortification:
    # Стоимость первого уровня; каждый следующий дороже кратно уровню. 2026-10-03: 500 → "10i" (1 000):
    # осадный лагерь укрепляют из казны клана, цена в железных монетах масштабируется с номиналами.
    cost: "10i"
    max-level: 3
    hits-per-level: 1
  pre-start-minutes: 20
  # Общий лимит времени на осаду: если атакующие не удержали лагеря за это время, побеждает защитник.
  duration-minutes: 20
  # Сколько все лагеря должны простоять одновременно, чтобы осада прорвалась. Всегда меньше
  # duration-minutes - иначе у атакующего физически не остаётся времени на победу.
  camp-hold-minutes: 10
  cooldown-hours: 24
  min-attacker-online: 1
  min-defender-online: 5
  max-concurrent: 3
  camp-count-min: 3
  camp-count-max: 4
  camp-distance-blocks: 50
  camp-respawn-minutes: 2
  # Доля сундука защитника, которую получает победивший атакующий (случайно между min/max).
  win-chest-percent-min: 25
  win-chest-percent-max: 30
  reward-artifact: true

# Набег (§3.1) — третий тип конфликта: возможен только если у защитника мало людей онлайн,
# запрещён против клана с высоким влиянием. Успешен, если атакующие вынесли хоть что-то из
# сундука защитника (деньги и/или предметы, оба ограничены процентом от того, что было в
# сундуке на момент начала набега) до истечения duration-minutes.
raid:
  pre-start-minutes: 5
  duration-minutes: 10
  cooldown-hours: 24
  min-attacker-online: 1
  max-defender-online: 2
  loot-money-percent: 50
  loot-item-slot-percent: 50
  win-exp-multiplier: 0.5
  # Материалы ванильных предметов для бонусного "редкого" дропа при успешном набеге; пусто = без бонуса.
  bonus-items: []

integration:
  advanced-claims:
    # Клановая территория без привата LoveClaims не существует — этот флаг больше не значит
    # "не заводить приват, но территорию всё равно взять": выключить его означает выключить
    # захват территорий вообще (см. territory.advancedclaims-disabled).
    enabled: true
    claim-radius: 35 # Radius for LoveClaims (71x71x71 area)
    # Вертикальная полоса привата вокруг Y знамени, а не вся высота мира (было: min..max мира,
    # то есть приват защищал весь столбец от бедрока до предела постройки над базой любой высоты).
    # Обрезается границами мира (world.getMinHeight()/getMaxHeight()).
    claim-height-below: 64  # блоков вниз от знамени
    claim-height-above: 128 # блоков вверх от знамени
    border-display-ticks: 100 # Duration in ticks for showing claim border (5 seconds)
    trust-mapping:
      LEADER: OWNER
      GUARDIAN: BUILD
      MEMBER: CONTAINER
      RECRUIT: CONTAINER

# Архив конфликтов: войны, осады и набеги переживают перезапуск сервера
history:
  # Сколько записей показывает /clan history
  command-entries: 10
  # Реванш: клан, проигравший этому противнику прошлый конфликт, получает
  # прибавку к очкам войны. 0 отключает бонус.
  rematch-bonus-percent: 15
  # Как часто пересчитывается свежесть заслуг (в минутах, минимум 5)
  freshness-refresh-minutes: 30
  # Ниже какой доли не опускается вклад побед во влияние, даже если все они давние
  influence-decay-floor: 0.25
  # Давность, после которой победа перестаёт греть влияние клана (в днях).
  # 0 отключает распад — влияние считается по всем победам за всю историю.
  influence-decay-days: 30
