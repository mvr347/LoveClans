info:
  namespace: loveclans
items:
  siege_camp:
    display_name: "Осадный лагерь"
    permission: loveclans.siege.siege_camp
    resource:
      material: PAPER
      generate: false
      model_path: siege/siege_camp
    behaviours:
      furniture:
        entity: item_display
        gravity: false
        fixed_rotation: false
        opposite_direction: true
        solid: false
        light_level: 0
        hitbox:
          width: 1
          length: 1
          height: 1
        placeable_on:
          floor: true
          ceiling: false
          walls: false
        display_transformation:
          transform: HEAD
          translation:
            x: 0
            y: 0
            z: 0
          scale:
            x: 1
            y: 1
            z: 1
          render_size:
            width: 5
            height: 4
